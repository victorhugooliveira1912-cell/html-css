<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabelas</title>
    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;
        }
        table{
            width: 400px;
            height: 100px;
            border-collapse: collapse;
        }
        td {
            border: 1px solid black;
            padding: 8;
            text-align: center;
        }
    </style>
</head>
<body>
    <h1>
        Minha Primeira tabela
    </h1>
    <table>
        <tr>
            <td>A1</td>
            <td>B2</td>
            <td>C3</td>
        </tr>
        <tr id="color1">
            <td>A2</td>
            <td>B2</td>
            <td>C2</td>
        </tr>
        <tr>
            <td>A3</td>
            <td id="color2">C3</td>
            <td>B3</td>
        </tr>
    </table>
</body>
</html>
