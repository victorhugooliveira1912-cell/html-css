<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabelas</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
        }

        table {
            width: 500px;
            border-collapse: collapse;
        }

        td,
        th {
            border: 1px solid black;
            padding: 10px;
        }

        thead {
            background-color: rgb(130, 0, 0);
            color: rgb(0, 0, 130);
        }

        tbody {
            background-color: rgb(00, 130, 00);
            color: rgb(130, 0, 0);
        }

        tfoot {
            background-color: rgb(0, 0, 130);
            color: rgb(00, 130, 00);
        }
            caption{
                border: 1px solid black;
                margin-right: 200px;
                background-color: black;
                color: white;
            }
    </style>
</head>

<body>
    <h1>Usa de tabelas grandes</h1>
    <p>Aqui temos os três maiores estados em População</p>
    <table>
        <thead>
            <tr>
                <th>Estado</th>
                <th>População</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>São paulo</td>
                <td> 45.919.049</td>
            </tr>
            <tr>
                <td>Minas Gerais</td>
                <td> 21.168.791</td>
            </tr>
            <tr>
                <td>Rio de janeiro</td>
                <td> 17.264.943</td>
            </tr>
        </tbody>
        <tfoot>
            <tr>
                <th>Total</th>
                <Td>84.352.783</Td>
            </tr>
        </tfoot>
        <caption>Populaçãodas unidades federativas</caption>
    </table>
</body>

</html>
