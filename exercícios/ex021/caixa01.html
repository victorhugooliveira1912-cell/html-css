<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modelos de caixas</title>
    <style>
        h1{
            background-color: darkslategray;
            height: 300px;
            width: 300px;
            font-size: 70px;
            border:10px solid darkred;
            padding: 10px;
            margin: auto;
            outline: 5px dashed salmon;
        }
        a{
            border:10px solid darkslategray;
            color: darkblue;
            padding: 10px;
        }
    </style>
</head>
<body>
    <h1>
        Exemplo de caixa box-level
    </h1>
    <p>
        Parágrafos também são exemplos de box-level, mas os <a href="#">links são exmplos de caixas inline-level</a>. Vamos ver como tudo funciona
    </p>
</body>
</html>
