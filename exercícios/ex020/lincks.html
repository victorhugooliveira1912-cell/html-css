<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Links</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
        }

        a {
            color: black;
            text-decoration: none;
            width: 120%;
        }

        a:hover {
            color: darkred;
            text-decoration: underline;
        }

        a:active {
            color: darkblue;
        }
        a::after{
            content: ' [link]';
            text-decoration: none;
            font-weight: 110%;
            color: darkgrey;
        }
    </style>
</head>

<body>
    <h1>Personalisando Links</h1>
    <ul>
        <li><a href="https://gustavoguanabara.github.io" target="_blank">Repositório GitHub</a> </li>
        <li><a href="https://www.youtube.com/watch?v=vMlrcOVr7po&list=PLHz_AreHm4dlUpEXkY1AyVLQGcpSgVF8s&index=22" target="_blank">Canal
                do Youtube</a> </li>
        <li><a href="https://www.cursoemvideo.com" target="_blank">Site do curso em Vídeo</a> </li>
    </ul>
</body>

</html>
